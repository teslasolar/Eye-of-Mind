<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eye of Mind | κ=0.618</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--k:#f59e0b;--bg:#0f0f23;--fg:#e0e0e0}
body{font-family:system-ui;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eye{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 5%,var(--k) 30%,#000 70%);box-shadow:0 0 60px var(--k);animation:pulse 3s ease-in-out infinite;cursor:pointer;transition:box-shadow 0.5s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.eye.focused{box-shadow:0 0 80px #22c55e}
.eye.intense{box-shadow:0 0 100px #a855f7}
.eye.distracted{box-shadow:0 0 40px #ef4444}
h1{margin-top:1.5rem;font-size:2rem;background:linear-gradient(90deg,var(--k),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.metrics{font-family:monospace;color:#888;margin-top:0.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.metric{display:flex;align-items:center;gap:0.5rem}
.meter{width:80px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.meter-fill{height:100%;transition:width 0.2s,background 0.3s}
nav{margin-top:2rem;display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center}
nav a{padding:0.5rem 1rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:0.5rem;color:var(--fg);text-decoration:none;transition:all 0.2s;font-size:0.9rem}
nav a:hover{border-color:var(--k);box-shadow:0 0 15px rgba(245,158,11,0.3)}
.demos{margin-top:1.5rem;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center}
.demos a{padding:0.4rem 0.8rem;background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(236,72,153,0.2));border:1px solid rgba(245,158,11,0.3);border-radius:0.5rem;color:var(--k);text-decoration:none;font-size:0.8rem;transition:all 0.2s}
.demos a:hover{background:linear-gradient(135deg,rgba(245,158,11,0.3),rgba(236,72,153,0.3))}
#status{position:fixed;bottom:1rem;left:1rem;right:1rem;font-size:0.7rem;color:#666;display:flex;justify-content:space-between;align-items:center}
.thought-state{padding:3px 8px;border-radius:4px;font-weight:bold;text-transform:uppercase;font-size:0.65rem;letter-spacing:0.5px}
.thought-state.focused{background:#22c55e20;color:#22c55e}
.thought-state.normal{background:#f59e0b20;color:#f59e0b}
.thought-state.wandering{background:#eab30820;color:#eab308}
.thought-state.distracted{background:#ef444420;color:#ef4444}
.thought-state.intense{background:#a855f720;color:#a855f7}
.rng-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
</style>
</head>
<body>
<div class="eye" id="eye" onclick="location.href='core/thought.html'"></div>
<h1>Eye of Mind</h1>
<div class="metrics">
<div class="metric">κ = <span id="kval">0.618</span><div class="meter"><div class="meter-fill" id="kappaMeter" style="background:#f59e0b"></div></div></div>
<div class="metric"><span class="rng-dot" id="rngDot"></span>RNG <span id="rngVal">—</span></div>
</div>
<nav>

<a href="models/">🧠 Models</a>
<a href="docs/">📚 Docs</a>
<a href="tests/">🧪 Tests</a>
</nav>
<div class="demos">
<a href="core/thought.html">🧠 Thought Inference</a>
<a href="core/kappa.html">κ Engine</a>
<a href="core/intention.html">Screen-Thought</a>
<a href="models/yggdrasil.html">Yggdrasil</a>
<a href="models/femto.html">FemtoLLM</a>
</div>
<div id="status">
<span id="statusText">Initializing consciousness...</span>
<span class="thought-state normal" id="thoughtState">calibrating</span>
</div>
<script type="module">
import { ThoughtInference } from './core/thought-inference.js';

const engine = new ThoughtInference();
engine.start();

const eye = document.getElementById('eye');
const kval = document.getElementById('kval');
const kappaMeter = document.getElementById('kappaMeter');
const rngDot = document.getElementById('rngDot');
const rngVal = document.getElementById('rngVal');
const statusText = document.getElementById('statusText');
const thoughtState = document.getElementById('thoughtState');

const stateColors = {
  focused: '#22c55e',
  normal: '#f59e0b',
  wandering: '#eab308',
  distracted: '#ef4444',
  intense: '#a855f7',
  unknown: '#666'
};

setInterval(() => {
  const s = engine.getState();
  const rng = engine.rng.getCoherence();

  // Update eye glow based on state
  eye.className = 'eye ' + s.state;

  // Kappa
  kval.textContent = s.kappa.toFixed(4);
  kappaMeter.style.width = (s.kappa * 100) + '%';
  kappaMeter.style.background = stateColors[s.kappaState] || stateColors.normal;

  // RNG
  if (rng) {
    rngVal.textContent = rng.coherence.toFixed(2);
    rngDot.style.background = rng.state === 'coherent' ? '#a855f7' : rng.state === 'trending' ? '#eab308' : '#666';
  }

  // Thought state
  thoughtState.textContent = s.state;
  thoughtState.className = 'thought-state ' + s.state;

  // Status
  const conf = (s.confidence * 100).toFixed(0);
  statusText.textContent = `${conf}% confidence | Move mouse & type to calibrate`;
}, 200);
</script>
</body>
</html>
