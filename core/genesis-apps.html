<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font:11px/1.4 monospace;height:100vh;display:flex;flex-direction:column}
.top{display:flex;gap:8px;padding:8px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;align-items:center}
.top button{background:#0f0;color:#000;border:none;padding:6px 12px;cursor:pointer;font:bold 10px monospace}
.top button:disabled{opacity:0.3}
.top .ent{color:#0a0;margin-left:auto}
.top select{background:#111;color:#0f0;border:1px solid #222;padding:4px;font:10px monospace}
.log{height:80px;background:#050505;border-bottom:1px solid #1a1a1a;overflow-y:auto;padding:4px 8px;font-size:10px}
.log div{border-bottom:1px solid #0a0a0a;padding:2px 0}
.log .e{color:#f00}.log .o{color:#0f0}.log .w{color:#ff0}.log .i{color:#0af}
.main{flex:1;display:flex}
.preview{flex:1}
.preview iframe{width:100%;height:100%;border:none;background:#111}
.code{width:400px;background:#0a0a0a;border-left:1px solid #1a1a1a;overflow:auto;padding:8px;font-size:9px;display:none}
.code.show{display:block}
.status{padding:4px 8px;background:#0a0a0a;border-top:1px solid #1a1a1a;font-size:10px;color:#666;display:flex;gap:16px}
</style>
</head>
<body>
<div class="top">
<button id="gen">⚡ GENERATE</button>
<button id="iter">🔄 ITERATE</button>
<button id="fix">🔧 FIX</button>
<button id="exp">📦 EXPORT</button>
<button id="cod">{ }</button>
<select id="mdl">
<option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama-3.2-3B</option>
<option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama-3.2-1B</option>
<option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5-1.5B</option>
<option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2-1.7B</option>
</select>
<span class="ent">e:<span id="e">0.0000</span></span>
</div>
<div class="log" id="log"></div>
<div class="main">
<div class="preview"><iframe id="frame"></iframe></div>
<div class="code" id="code"></div>
</div>
<div class="status">
<span id="mdls">model: loading...</span>
<span id="stats">—</span>
</div>
<script type="module">
import*as llm from'https://esm.run/@mlc-ai/web-llm';

let eng=null,src='',errs=[],generating=false;

// Architecture patterns (token compressed)
const ARCH=`
UDT:uuid,version,tokens,path,parent,deps,tags
COMPONENTS:header,nav,main,aside,footer,modal,card,list,form,chart,table,grid
PATTERNS:crud,dashboard,wizard,feed,gallery,editor,player,game,chat,poll
LAYOUTS:single,split,grid,stack,sidebar,tabs,accordion
INPUTS:text,number,range,toggle,select,radio,checkbox,file,color,date
ACTIONS:click,submit,drag,swipe,hover,focus,scroll,resize
STATE:local,session,memory,sync,async,stream
STYLE:dark,light,neon,minimal,brutalist,glass,retro,cyber
`;

// ISA-style instruction set
const ISA=`
RENDER(el,props):create element with properties
BIND(state,el):two-way data binding
ON(event,handler):attach event listener
FETCH(url,cb):async data fetch
STORE(key,val):persist to localStorage
LOAD(key):read from localStorage
LOOP(arr,template):render array items
COND(test,a,b):conditional render
ANIM(el,keyframes,opts):animate element
TIMER(fn,ms):interval/timeout
RNG():entropy random 0-1
PICK(arr):entropy select from array
`;

const log=(m,t='')=>{const d=document.getElementById('log');d.innerHTML=`<div class="${t}">${new Date().toLocaleTimeString().slice(0,8)} ${m}</div>`+d.innerHTML;d.scrollTop=0};

const entropy=()=>{let a=0;for(let i=0;i<100;i++)a+=(performance.now()*1e6)%1;return(a/100+(Date.now()%1000)/1000)/2};
const ent=()=>{const e=entropy();document.getElementById('e').textContent=e.toFixed(4);return e};
const pick=arr=>arr[Math.floor(ent()*arr.length)];
const rng=(min,max)=>Math.floor(min+ent()*(max-min+1));

// Generate entropy seed for this generation
const genSeed=()=>{
const pattern=pick(['crud','dashboard','wizard','feed','gallery','editor','player','game','chat','poll','tool','viz']);
const layout=pick(['single','split','grid','sidebar','tabs']);
const style=pick(['dark','light','neon','minimal','brutalist','glass','cyber']);
const primary=`hsl(${rng(0,360)},${rng(50,80)}%,${rng(40,60)}%)`;
const components=rng(2,5);
const interactive=ent()>0.4;
const animated=ent()>0.5;
return{pattern,layout,style,primary,components,interactive,animated,entropy:ent()};
};

// Build prompt from entropy
const buildPrompt=(seed,prev='')=>{
const iterateCtx=prev?`\nPREVIOUS VERSION:\n${prev.slice(0,800)}\nIMPROVE: add features, fix bugs, enhance UX.\n`:'';
return`You are a code generator. Output ONLY valid HTML. No explanation.

ARCHITECTURE:
${ARCH}
ISA:
${ISA}

ENTROPY SEED:
pattern:${seed.pattern}
layout:${seed.layout}
style:${seed.style}
primary:${seed.primary}
components:${seed.components}
interactive:${seed.interactive}
animated:${seed.animated}
entropy:${seed.entropy.toFixed(6)}
${iterateCtx}
Generate a complete, functional single-file HTML application.
- Working JavaScript (ES6+)
- Responsive CSS
- Real interactivity (buttons work, forms submit, state updates)
- Use the entropy values to influence randomness in the app
- Dark background (#0a0a0a), primary color ${seed.primary}
- No external dependencies except CDN libs if needed
- Include inline CSS and JS
- Start with <!DOCTYPE html>

OUTPUT HTML:`;
};

// Load model
const loadModel=async()=>{
const modelId=document.getElementById('mdl').value;
document.getElementById('mdls').textContent='model: loading...';
document.getElementById('mdls').style.color='#ff0';
log(`loading ${modelId}...`,'w');
try{
eng=await llm.CreateMLCEngine(modelId,{
initProgressCallback:p=>document.getElementById('mdls').textContent=p.text||'loading...'
});
document.getElementById('mdls').textContent=`model: ${modelId.split('-')[0]}`;
document.getElementById('mdls').style.color='#0f0';
log('model ready','o');
}catch(e){
document.getElementById('mdls').textContent='model: failed';
document.getElementById('mdls').style.color='#f00';
log('model failed: '+e.message,'e');
}
};

document.getElementById('mdl').onchange=loadModel;

// Generate
const generate=async(iterate=false)=>{
if(generating||!eng)return;
generating=true;
document.getElementById('gen').disabled=true;
document.getElementById('iter').disabled=true;

const seed=genSeed();
log(`generating: ${seed.pattern}/${seed.layout}/${seed.style}`,'i');
const t0=performance.now();

const prompt=buildPrompt(seed,iterate?src:'');

try{
const r=await eng.chat.completions.create({
messages:[{role:'user',content:prompt}],
max_tokens:4000,
temperature:0.8+ent()*0.2
});

let code=r.choices[0]?.message?.content||'';
code=code.replace(/```\w*\n?/g,'').trim();
const idx=code.indexOf('<!DOCTYPE');
if(idx>=0)code=code.slice(idx);
else if(code.indexOf('<html')>=0)code='<!DOCTYPE html>'+code.slice(code.indexOf('<html'));

src=code;
render();

const time=((performance.now()-t0)/1000).toFixed(1);
const tokens=r.usage?.total_tokens||0;
document.getElementById('stats').textContent=`${time}s | ${tokens} tokens | ${seed.pattern}`;
log(`generated in ${time}s (${tokens} tokens)`,'o');

testApp();
}catch(e){
log('generation failed: '+e.message,'e');
}

generating=false;
document.getElementById('gen').disabled=false;
document.getElementById('iter').disabled=false;
};

const render=()=>{
document.getElementById('frame').srcdoc=src;
document.getElementById('code').textContent=src;
};

// Self-test
const testApp=()=>{
errs=[];
const frame=document.getElementById('frame');
frame.onload=()=>{
try{
const doc=frame.contentDocument;
if(!doc.body||!doc.body.innerHTML.trim()){errs.push('empty');log('empty body','e')}
doc.querySelectorAll('script').forEach((s,i)=>{
try{new Function(s.textContent)}catch(e){errs.push(e.message);log(`js error: ${e.message}`,'e')}
});
if(errs.length===0)log('tests passed','o');
}catch(e){log('test failed: '+e.message,'e')}
};
};

// Fix with LLM
const fix=async()=>{
if(!eng||errs.length===0){log('nothing to fix','w');return}
log('fixing...','w');
const prompt=`Fix these errors in the HTML: ${errs.join('; ')}\n\nCode:\n${src.slice(0,2000)}\n\nReturn ONLY fixed HTML starting with <!DOCTYPE html>:`;
try{
const r=await eng.chat.completions.create({messages:[{role:'user',content:prompt}],max_tokens:4000,temperature:0.3});
let fixed=r.choices[0]?.message?.content||'';
fixed=fixed.replace(/```\w*\n?/g,'').trim();
if(fixed.includes('<!DOCTYPE')){src=fixed.slice(fixed.indexOf('<!'));render();log('fix applied','o');testApp()}
}catch(e){log('fix failed: '+e.message,'e')}
};

// Export
const exp=()=>{
if(!src)return;
const b=new Blob([src],{type:'text/html'});
const a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download=`genesis-${Date.now()}.html`;
a.click();
log('exported','o');
};

// Events
document.getElementById('gen').onclick=()=>generate(false);
document.getElementById('iter').onclick=()=>generate(true);
document.getElementById('fix').onclick=fix;
document.getElementById('exp').onclick=exp;
document.getElementById('cod').onclick=()=>document.getElementById('code').classList.toggle('show');

setInterval(ent,200);
loadModel();
</script>
</body>
</html>
