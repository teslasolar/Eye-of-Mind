<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDEN Pro | AI-Enhanced GitHub Forest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font:11px/1.4 monospace;color:#ccc}
#c{display:block}
#ui{position:fixed;top:10px;left:10px;z-index:10;display:flex;flex-direction:column;gap:8px}
#ui .row{display:flex;gap:4px}
#ui input{background:#111;border:1px solid #333;color:#0f0;padding:4px 8px;font:inherit}
#ui input[type=text]{width:180px}
#ui button{background:#1a1a1a;border:1px solid #333;color:#0f0;padding:4px 8px;cursor:pointer;font:inherit}
#ui button:hover{background:#0f0;color:#000}
#ui button.active{background:#0a0;color:#fff}
#ui select{background:#111;border:1px solid #333;color:#0f0;padding:4px}
#stats{position:fixed;bottom:10px;left:10px;background:#0a0a0aee;border:1px solid #222;
padding:8px;font-size:10px;min-width:150px}
#stats div{margin:2px 0}
#stats span{color:#0f0}
#panel{position:fixed;top:10px;right:10px;width:350px;max-height:90vh;background:#0a0a0aee;
border:1px solid #222;display:none;overflow:hidden;flex-direction:column}
#panel.show{display:flex}
#panel .head{padding:8px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between}
#panel .head h3{color:#0f0;font-size:11px;overflow:hidden;text-overflow:ellipsis}
#panel .close{cursor:pointer;color:#f00;padding:0 4px}
#panel .tabs{display:flex;border-bottom:1px solid #222}
#panel .tab{flex:1;padding:6px;text-align:center;cursor:pointer;background:#0a0a0a;color:#666}
#panel .tab.active{background:#111;color:#0f0}
#panel .content{flex:1;overflow:auto;padding:8px}
#panel pre{font-size:9px;color:#888;white-space:pre-wrap}
#panel .ai{color:#8af;line-height:1.5}
#search{position:fixed;top:50px;left:10px;background:#0a0a0aee;border:1px solid #222;
padding:8px;display:none;max-height:200px;overflow:auto}
#search.show{display:block}
#search div{padding:4px;cursor:pointer}
#search div:hover{background:#111;color:#0f0}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;
align-items:center;justify-content:center;color:#0f0;gap:1rem}
.loading.hide{display:none}
.progress{width:200px;height:4px;background:#222;border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:#0f0;width:0%;transition:width .3s}

background:#0a0a0aee;border:1px solid #222;padding:6px 12px;font-size:10px}
#entropy span{color:#ff0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
<div class="row">
<input type="text" id="repo" placeholder="owner/repo" value="anthropics/claude-code">
<button id="go">Load</button>
</div>
<div class="row">
<input type="text" id="filter" placeholder="Filter: *.js, src/">
<button id="apply">Apply</button>
</div>
<div class="row">
<button id="mForest" class="active">🌳 Forest</button>
<button id="mGalaxy">🌌 Galaxy</button>
<button id="mNeural">🧠 Neural</button>
</div>
<div class="row">
<select id="sort">
<option value="fib">Fibonacci</option>
<option value="alpha">Alphabetical</option>
<option value="size">By Size</option>
<option value="type">By Type</option>
</select>
</div>
</div>

<div id="entropy">Entropy: <span id="ent">0.0000</span></div>

<div id="stats">
<div>Files: <span id="sFiles">0</span></div>
<div>Types: <span id="sTypes">0</span></div>
<div>LOC: <span id="sLoc">~0</span></div>
<div>Depth: <span id="sDepth">0</span></div>
<div>Mode: <span id="sMode">Forest</span></div>
</div>

<div id="search"></div>

<div id="panel">
<div class="head"><h3 id="pname">File</h3><span class="close">×</span></div>
<div class="tabs">
<div class="tab active" data-t="code">Code</div>
<div class="tab" data-t="ai">AI</div>
<div class="tab" data-t="deps">Deps</div>
</div>
<div class="content"><pre id="pcode"></pre><div id="pai" class="ai" style="display:none"></div>
<div id="pdeps" style="display:none"></div></div>
</div>

<div class="loading" id="load">
<div>Loading EDEN Pro...</div>
<div class="progress"><div class="progress-bar" id="prog"></div></div>
<div id="loadMsg" style="font-size:10px;color:#666"></div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import*as T from'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';

const W=window,D=document,φ=(1+Math.sqrt(5))/2,τ=Math.PI*2;
const $=s=>D.getElementById(s);

let scene,cam,ren,ctrl,nodes=[],edges=[],files={},allFiles=[],repoData=null;
let mode='forest',engine=null;

// Entropy harvester
let entropy=0;
function harvest(){
let a=0;
for(let i=0;i<200;i++)a+=(performance.now()*1e6)%1;
entropy=(a/200+(Date.now()%1000)/1000)/2;
$('ent').textContent=entropy.toFixed(4);
return entropy;
}
setInterval(harvest,100);

// Init
function init(){
scene=new T.Scene();
scene.background=new T.Color(0x030308);
scene.fog=new T.FogExp2(0x030308,0.015);

cam=new T.PerspectiveCamera(60,W.innerWidth/W.innerHeight,0.1,1000);
cam.position.set(0,40,60);

ren=new T.WebGLRenderer({canvas:$('c'),antialias:true});
ren.setSize(W.innerWidth,W.innerHeight);
ren.setPixelRatio(Math.min(W.devicePixelRatio,2));

ctrl=new OrbitControls(cam,$('c'));
ctrl.enableDamping=true;
ctrl.dampingFactor=0.05;

// Lights
scene.add(new T.AmbientLight(0x404040,0.5));
const sun=new T.DirectionalLight(0xffffff,1);
sun.position.set(50,100,50);
scene.add(sun);
const rim=new T.PointLight(0x0066ff,0.5,100);
rim.position.set(-30,20,-30);
scene.add(rim);

// Ground/base per mode
updateGround();
$('load').classList.add('hide');
animate();
}

function updateGround(){
scene.children.filter(c=>c.userData.ground).forEach(c=>scene.remove(c));
if(mode==='forest'){
const g=new T.Mesh(new T.CircleGeometry(120,64),
new T.MeshLambertMaterial({color:0x0a1a0a}));
g.rotation.x=-Math.PI/2;g.userData.ground=true;
scene.add(g);
}else if(mode==='galaxy'){
const g=new T.Points(
new T.BufferGeometry().setFromPoints(
Array(2000).fill().map(()=>new T.Vector3(
(Math.random()-.5)*200,(Math.random()-.5)*200,(Math.random()-.5)*200
))),
new T.PointsMaterial({color:0x222244,size:0.3})
);
g.userData.ground=true;
scene.add(g);
}
}

function animate(){
requestAnimationFrame(animate);
ctrl.update();
const t=Date.now()*0.001;
nodes.forEach((n,i)=>{
if(mode==='forest'){
n.rotation.y+=0.002;
n.position.y=n.userData.baseY+Math.sin(t+i*0.5)*0.1;
}else if(mode==='galaxy'){
n.rotation.y+=0.005;
n.rotation.x+=0.002;
}else{
n.scale.setScalar(1+Math.sin(t*2+i)*0.05);
}
});
edges.forEach(e=>{e.material.opacity=0.2+Math.sin(t*3)*0.1;});
ren.render(scene,cam);
}

// Positioning
function getPos(i,n,m){
if(m==='forest'){
const r=Math.sqrt(i/n)*50;
const θ=i*τ/φ/φ;
return{x:Math.cos(θ)*r,y:0,z:Math.sin(θ)*r};
}else if(m==='galaxy'){
const θ=i*τ/φ/φ;
const r=5+Math.sqrt(i)*3;
const arm=Math.floor(i%3)*τ/3;
const spiral=θ+arm;
return{
x:Math.cos(spiral)*r,
y:(Math.random()-.5)*10+Math.sin(i*0.3)*5,
z:Math.sin(spiral)*r
};
}else{// neural
const layers=Math.ceil(Math.sqrt(n));
const layer=Math.floor(i/layers);
const pos=i%layers;
const angle=pos*τ/Math.min(layers,n-layer*layers);
const r=8+layer*6;
return{x:Math.cos(angle)*r,y:layer*3-n*0.1,z:Math.sin(angle)*r};
}
}

// File color
function getColor(path){
const ext=path.split('.').pop()||'';
const c={js:0xf0db4f,ts:0x3178c6,py:0x3776ab,html:0xe34c26,css:0x264de4,
md:0x083fa1,json:0x5a5a5a,rs:0xdea584,go:0x00add8,rb:0xcc342d,
java:0xb07219,cpp:0xf34b7d,c:0x555555,sh:0x89e051,yml:0xcb171e,
yaml:0xcb171e,toml:0x9c4221,vue:0x41b883,svelte:0xff3e00,jsx:0x61dafb,tsx:0x3178c6};
return c[ext]||0x44aa44;
}

// Create node
function mkNode(file,i,n){
const{x,y,z}=getPos(i,n,mode);
const col=getColor(file.path);
const g=new T.Group();
g.position.set(x,y,z);
g.userData={file:file.path,sha:file.sha,baseY:y,size:file.size||0};

if(mode==='forest'){
// Stem
const stem=new T.Mesh(
new T.CylinderGeometry(0.04,0.07,1.5+harvest(),6),
new T.MeshLambertMaterial({color:0x228822})
);
stem.position.y=0.75;
g.add(stem);
// Flower
const flower=new T.Group();
flower.position.y=1.5;
for(let p=0;p<5;p++){
const petal=new T.Mesh(
new T.SphereGeometry(0.25,6,6),
new T.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:0.3})
);
const a=p*τ/5;
petal.position.set(Math.cos(a)*0.35,0,Math.sin(a)*0.35);
petal.scale.set(1,0.3,0.5);
flower.add(petal);
}
flower.add(new T.Mesh(
new T.SphereGeometry(0.15,6,6),
new T.MeshLambertMaterial({color:0xffff00,emissive:0xffff00,emissiveIntensity:0.6})
));
g.add(flower);
}else if(mode==='galaxy'){
// Star
const star=new T.Mesh(
new T.IcosahedronGeometry(0.3+Math.random()*0.2,0),
new T.MeshBasicMaterial({color:col})
);
g.add(star);
// Glow
const glow=new T.Sprite(new T.SpriteMaterial({
color:col,transparent:true,opacity:0.4,
map:new T.CanvasTexture((() => {
const cv=D.createElement('canvas');cv.width=cv.height=64;
const cx=cv.getContext('2d');
const gr=cx.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'rgba(255,255,255,1)');
gr.addColorStop(1,'rgba(255,255,255,0)');
cx.fillStyle=gr;cx.fillRect(0,0,64,64);
return cv;
})())
}));
glow.scale.set(2,2,1);
g.add(glow);
}else{
// Neuron
const neuron=new T.Mesh(
new T.SphereGeometry(0.4,12,12),
new T.MeshPhongMaterial({color:col,emissive:col,emissiveIntensity:0.2,shininess:50})
);
g.add(neuron);
}

scene.add(g);
nodes.push(g);
files[file.path]=file;
}

// Create edges (neural mode)
function mkEdges(){
edges.forEach(e=>scene.remove(e));
edges=[];
if(mode!=='neural'||nodes.length<2)return;

// Connect nearby nodes
nodes.forEach((n,i)=>{
const near=nodes.filter((m,j)=>j!==i&&n.position.distanceTo(m.position)<15).slice(0,3);
near.forEach(m=>{
const geo=new T.BufferGeometry().setFromPoints([n.position,m.position]);
const line=new T.Line(geo,new T.LineBasicMaterial({color:0x00ff00,transparent:true,opacity:0.2}));
scene.add(line);
edges.push(line);
});
});
}

// Rebuild visualization
function rebuild(fileList){
nodes.forEach(n=>scene.remove(n));
nodes=[];files={};
updateGround();
fileList.forEach((f,i)=>mkNode(f,i,fileList.length));
mkEdges();
updateStats(fileList);
}

// Load repo
async function loadRepo(repo){
const[owner,name]=repo.split('/');
if(!owner||!name)return alert('Format: owner/repo');

$('load').classList.remove('hide');
$('loadMsg').textContent='Fetching repository...';
$('prog').style.width='20%';

try{
const r=await fetch(`https://api.github.com/repos/${owner}/${name}`);
if(!r.ok)throw new Error('Repo not found');
repoData=await r.json();
$('prog').style.width='40%';

$('loadMsg').textContent='Loading file tree...';
const t=await fetch(`https://api.github.com/repos/${owner}/${name}/git/trees/${repoData.default_branch}?recursive=1`);
const tree=await t.json();
$('prog').style.width='70%';

allFiles=tree.tree.filter(f=>f.type==='blob').slice(0,500);
$('loadMsg').textContent=`Growing ${allFiles.length} nodes...`;
$('prog').style.width='90%';

rebuild(allFiles);
$('prog').style.width='100%';
setTimeout(()=>$('load').classList.add('hide'),300);
}catch(e){
$('loadMsg').textContent='Error: '+e.message;
setTimeout(()=>$('load').classList.add('hide'),2000);
}
}

// Filter
function applyFilter(){
const f=$('filter').value.trim();
if(!f){rebuild(allFiles);return;}
const filtered=allFiles.filter(file=>{
if(f.startsWith('*.')){
const ext=f.slice(2);
return file.path.endsWith('.'+ext);
}
return file.path.includes(f);
});
rebuild(filtered);
}

// Sort
function applySort(){
const s=$('sort').value;
let sorted=[...allFiles];
if(s==='alpha')sorted.sort((a,b)=>a.path.localeCompare(b.path));
else if(s==='size')sorted.sort((a,b)=>(b.size||0)-(a.size||0));
else if(s==='type')sorted.sort((a,b)=>{
const ea=a.path.split('.').pop();
const eb=b.path.split('.').pop();
return ea.localeCompare(eb);
});
rebuild(sorted);
}

// Stats
function updateStats(list){
$('sFiles').textContent=list.length;
const types=new Set(list.map(f=>f.path.split('.').pop()));
$('sTypes').textContent=types.size;
$('sLoc').textContent='~'+Math.round(list.reduce((a,f)=>(f.size||0)+a,0)/30);
$('sDepth').textContent=Math.max(...list.map(f=>f.path.split('/').length));
$('sMode').textContent=mode.charAt(0).toUpperCase()+mode.slice(1);
}

// Search
$('filter').oninput=()=>{
const v=$('filter').value;
const box=$('search');
if(v.length<2){box.classList.remove('show');return;}
const matches=allFiles.filter(f=>f.path.toLowerCase().includes(v.toLowerCase())).slice(0,10);
if(matches.length){
box.innerHTML=matches.map(f=>`<div data-path="${f.path}">${f.path}</div>`).join('');
box.classList.add('show');
}else box.classList.remove('show');
};
$('search').onclick=e=>{
if(e.target.dataset.path){
$('filter').value=e.target.dataset.path;
$('search').classList.remove('show');
applyFilter();
}
};

// Click handler
function onClick(e){
const mouse=new T.Vector2(
(e.clientX/W.innerWidth)*2-1,
-(e.clientY/W.innerHeight)*2+1
);
const ray=new T.Raycaster();
ray.setFromCamera(mouse,cam);
const hits=ray.intersectObjects(nodes,true);
if(hits.length){
let g=hits[0].object;
while(g.parent&&!g.userData.file)g=g.parent;
if(g.userData.file)showFile(g.userData);
}
}

// Panel
async function showFile(data){
const panel=$('panel');
panel.classList.add('show');
$('pname').textContent=data.file;
$('pcode').textContent='Loading...';
$('pai').innerHTML='';
$('pdeps').innerHTML='';

switchTab('code');

try{
const r=await fetch(`https://api.github.com/repos/${$('repo').value}/git/blobs/${data.sha}`);
const blob=await r.json();
const code=atob(blob.content);
$('pcode').textContent=code.slice(0,8000)+(code.length>8000?'\n\n...(truncated)':'');

// Parse deps
const deps=[];
const importRe=/import\s+.*?from\s+['"](.+?)['"]/g;
const requireRe=/require\s*\(\s*['"](.+?)['"]\s*\)/g;
let m;
while((m=importRe.exec(code)))deps.push(m[1]);
while((m=requireRe.exec(code)))deps.push(m[1]);
$('pdeps').innerHTML=deps.length?deps.map(d=>`<div style="padding:2px;color:#8af">${d}</div>`).join(''):'<div style="color:#666">No imports detected</div>';

// AI ready
$('pai').innerHTML='<div style="color:#666">Click "Analyze" for AI summary</div><button onclick="analyzeFile()">Analyze</button>';
}catch(e){
$('pcode').textContent='Error: '+e.message;
}
}

function switchTab(t){
D.querySelectorAll('#panel .tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.t===t));
$('pcode').style.display=t==='code'?'block':'none';
$('pai').style.display=t==='ai'?'block':'none';
$('pdeps').style.display=t==='deps'?'block':'none';
}

W.analyzeFile=async()=>{
const code=$('pcode').textContent;
if(!code||code.startsWith('Loading'))return;
$('pai').innerHTML='Analyzing...';

// Simple heuristic analysis (no LLM needed)
const lines=code.split('\n');
const funcs=(code.match(/function\s+\w+|const\s+\w+\s*=\s*(\(|async)/g)||[]).length;
const classes=(code.match(/class\s+\w+/g)||[]).length;
const comments=lines.filter(l=>l.trim().startsWith('//')||l.trim().startsWith('*')).length;
const todos=(code.match(/TODO|FIXME|HACK/gi)||[]).length;

let analysis=`📊 **File Analysis**\n\n`;
analysis+=`• Lines: ${lines.length}\n`;
analysis+=`• Functions/methods: ~${funcs}\n`;
analysis+=`• Classes: ${classes}\n`;
analysis+=`• Comments: ${comments} lines (${Math.round(comments/lines.length*100)}%)\n`;
if(todos)analysis+=`• TODOs/FIXMEs: ${todos}\n`;
analysis+=`\n🔍 **Entropy insight:** ${harvest()>.5?'Complex structure detected':'Simple, linear flow'}\n`;
$('pai').innerHTML=analysis.replace(/\n/g,'<br>');
};

// Mode switch
function setMode(m){
mode=m;
D.querySelectorAll('#ui button[id^=m]').forEach(b=>b.classList.remove('active'));
$('m'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
if(allFiles.length)rebuild(allFiles);
}

// Events
$('go').onclick=()=>loadRepo($('repo').value);
$('repo').onkeydown=e=>{if(e.key==='Enter')$('go').click();};
$('apply').onclick=applyFilter;
$('sort').onchange=applySort;
$('mForest').onclick=()=>setMode('forest');
$('mGalaxy').onclick=()=>setMode('galaxy');
$('mNeural').onclick=()=>setMode('neural');
$('panel').querySelector('.close').onclick=()=>$('panel').classList.remove('show');
D.querySelectorAll('#panel .tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.t));
$('c').addEventListener('click',onClick);
W.addEventListener('resize',()=>{
cam.aspect=W.innerWidth/W.innerHeight;
cam.updateProjectionMatrix();
ren.setSize(W.innerWidth,W.innerHeight);
});

init();
</script>
</body>
