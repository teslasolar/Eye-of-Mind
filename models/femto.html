<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FemtoLLM | Eye of Mind</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
input{width:100%;padding:0.75rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#fff;font-size:1rem;margin-bottom:1rem}
.result{background:rgba(255,255,255,0.05);padding:1rem;border-radius:8px;margin-top:1rem}
.bar{height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin:4px 0;overflow:hidden}
.bar-fill{height:100%;background:var(--k);transition:width 0.3s}
.label{display:flex;justify-content:space-between;font-size:0.85rem}
.heuristic{color:#22c55e;font-size:0.75rem}
.mind-panel{background:rgba(255,255,255,0.03);padding:0.75rem;border-radius:6px;margin-top:1rem;font-size:0.8rem}
.mind-badge{padding:2px 6px;border-radius:3px;font-weight:bold;text-transform:uppercase;font-size:0.65rem}
.mind-badge.focused{background:#22c55e20;color:#22c55e}
.mind-badge.normal{background:#f59e0b20;color:#f59e0b}
.mind-badge.wandering{background:#eab30820;color:#eab308}
.mind-badge.distracted{background:#ef444420;color:#ef4444}
.mind-badge.intense{background:#a855f720;color:#a855f7}
</style>
</head>
<body>
<nav><a href="./">← Models</a> | <a href="../">Home</a></nav>
<main>
<h1>🧠 FemtoLLM Router</h1>
<input type="text" id="input" placeholder="Type a message to classify..." autofocus>
<div class="result" id="result">Type something to see classification...</div>
<div class="mind-panel">
Mind: <span id="mindState" class="mind-badge normal">—</span>
| κ: <span id="kappa">0.618</span>
| Typing rhythm affects classification confidence
</div>
</main>
<script type="module">
import { FemtoLLM } from './femto.js';
import { initThoughtWidget, ThoughtWidget } from '../core/thought-widget.js';

initThoughtWidget();
const thought = ThoughtWidget.getEngine();
const femto = new FemtoLLM(32);

const input = document.getElementById('input');
const result = document.getElementById('result');

const updateMind = () => {
  const s = thought.getState();
  document.getElementById('kappa').textContent = s.kappa.toFixed(4);
  const mindEl = document.getElementById('mindState');
  mindEl.textContent = s.state;
  mindEl.className = 'mind-badge ' + s.state;
};

setInterval(updateMind, 200);

input.addEventListener('input', () => {
  const text = input.value;
  if (!text) { result.innerHTML = 'Type something to classify...'; return; }

  const r = femto.classify(text);
  const s = thought.getState();

  // Boost confidence based on focus
  const focusBoost = s.state === 'focused' ? 1.2 : s.state === 'intense' ? 1.3 : s.state === 'distracted' ? 0.8 : 1;
  const adjRouteConf = Math.min(1, r.routeConf * focusBoost);
  const adjIntentConf = Math.min(1, r.intentConf * focusBoost);

  result.innerHTML = `
    <div class="label"><strong>Route:</strong> <span>${r.route} ${r.heuristic ? '<span class="heuristic">(heuristic)</span>' : ''}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${adjRouteConf*100}%"></div></div>
    <div class="label"><strong>Intent:</strong> <span>${r.intent}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${adjIntentConf*100}%"></div></div>
    <div style="margin-top:1rem;font-size:0.8rem;color:#888">
      Tokens: ${r.tokens} | Latency: ${r.latency.toFixed(2)}ms |
      Focus boost: ${focusBoost.toFixed(1)}x
    </div>
  `;
});
</script>
</body>
</html>
