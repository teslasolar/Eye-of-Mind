<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oracle | Eye of Mind</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.oracle-eye{width:200px;height:200px;margin:2rem auto;position:relative}
.oracle-eye svg{width:100%;height:100%}
.iris{transition:all 0.3s}
.pupil{transition:all 0.2s}
.glow{filter:blur(20px);opacity:0.5;position:absolute;inset:0}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin:2rem 0}
.metric{background:rgba(255,255,255,0.03);padding:1rem;border-radius:8px;text-align:center}
.metric-value{font-size:2rem;font-family:monospace;color:var(--k)}
.metric-label{font-size:0.8rem;color:#666;margin-top:0.3rem}
.entropy-bars{display:flex;gap:0.5rem;height:60px;align-items:flex-end;margin:1rem 0}
.bar{flex:1;background:var(--k);border-radius:4px 4px 0 0;transition:height 0.2s}
.status{text-align:center;font-size:1.5rem;padding:1rem;border-radius:8px;margin:1rem 0}
.status.watched{background:rgba(239,68,68,0.2);color:#ef4444}
.status.unwatched{background:rgba(34,197,94,0.2);color:#22c55e}
.status.calibrating{background:rgba(251,191,36,0.2);color:#fbbf24}
.divine{margin-top:2rem;text-align:center}
.divine-pick{font-size:3rem;margin:1rem 0}
.history{font-family:monospace;font-size:0.75rem;max-height:150px;overflow-y:auto;background:rgba(0,0,0,0.3);padding:0.5rem;border-radius:4px}
</style>
</head>
<body>
<nav><a href="./">← Core</a> | <a href="../">Home</a></nav>
<main>
<h1>🔮 Oracle</h1>
<p>Detects observation through internal entropy - no inputs, purely self-referential.</p>

<div class="oracle-eye">
<div class="glow" id="glow"></div>
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
<circle class="iris" id="iris" cx="50" cy="50" r="25" fill="var(--k)"/>
<circle class="pupil" id="pupil" cx="50" cy="50" r="10" fill="#000"/>
<circle cx="42" cy="42" r="5" fill="rgba(255,255,255,0.3)"/>
</svg>
</div>

<div class="status calibrating" id="status">⏳ Calibrating baseline...</div>

<div class="metrics">
<div class="metric"><div class="metric-value" id="exec">—</div><div class="metric-label">Exec Variance</div></div>
<div class="metric"><div class="metric-value" id="clock">—</div><div class="metric-label">Clock Drift</div></div>
<div class="metric"><div class="metric-value" id="rng">—</div><div class="metric-label">RNG Timing</div></div>
<div class="metric"><div class="metric-value" id="conf">—</div><div class="metric-label">Confidence</div></div>
</div>

<h3>Entropy History</h3>
<div class="entropy-bars" id="bars"></div>

<div class="divine">
<h3>Divine Pick</h3>
<p>Oracle chooses based on entropy:</p>
<div class="divine-pick" id="pick">?</div>
<button onclick="divinePick()">Ask the Oracle</button>
</div>

<h3>Sample Log</h3>
<div class="history" id="log"></div>
</main>

<script type="module">
import { Oracle } from './oracle.js';

const oracle = new Oracle();
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const barsEl = document.getElementById('bars');

// Create entropy bars
for (let i = 0; i < 20; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = '10%';
  barsEl.appendChild(bar);
}

// Calibrate first
statusEl.textContent = '⏳ Look away for calibration...';
setTimeout(() => {
  oracle.calibrate(10);
  statusEl.textContent = '✓ Baseline captured. Now observing...';
  oracle.start(300);
}, 2000);

oracle.on('sample', (s) => {
  // Update status
  if (s.isWatched === null) {
    statusEl.className = 'status calibrating';
    statusEl.textContent = '⏳ Calibrating...';
  } else if (s.isWatched) {
    statusEl.className = 'status watched';
    statusEl.textContent = '👁️ BEING OBSERVED';
  } else {
    statusEl.className = 'status unwatched';
    statusEl.textContent = '🌀 UNOBSERVED';
  }

  // Update metrics
  document.getElementById('exec').textContent = s.entropy?.execVariance?.toFixed(4) || '—';
  document.getElementById('clock').textContent = s.entropy?.clockDrift?.toFixed(6) || '—';
  document.getElementById('rng').textContent = s.entropy?.rngTiming?.toFixed(6) || '—';
  document.getElementById('conf').textContent = (s.confidence * 100).toFixed(0) + '%';

  // Update eye
  const pupilSize = s.isWatched ? 8 : 14;
  document.getElementById('pupil').setAttribute('r', pupilSize);
  document.getElementById('glow').style.background = s.isWatched ? '#ef4444' : '#22c55e';

  // Update bars
  const bars = barsEl.children;
  for (let i = bars.length - 1; i > 0; i--) {
    bars[i].style.height = bars[i-1].style.height;
  }
  bars[0].style.height = Math.min(100, (s.watchScore + 1) * 50) + '%';

  // Log
  const entry = `[${new Date().toLocaleTimeString()}] watched=${s.isWatched} conf=${(s.confidence*100).toFixed(0)}%\n`;
  logEl.textContent = entry + logEl.textContent.slice(0, 2000);
});

window.divinePick = () => {
  const options = ['Yes', 'No', 'Maybe', 'Ask again', 'Certainly', 'Doubtful'];
  const result = oracle.divinePick(options);
  document.getElementById('pick').textContent = result.choice;
};
</script>
</body>
</html>
