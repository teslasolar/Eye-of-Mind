<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>κ Engine | Eye of Mind</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.viz{display:flex;gap:2rem;flex-wrap:wrap}
canvas{border:1px solid rgba(255,255,255,0.2);border-radius:8px}
.stats{font-family:monospace;margin-top:1rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.state{padding:4px 8px;border-radius:4px;font-weight:bold}
.state.optimal{background:#f59e0b20;color:#f59e0b}
.state.ordered{background:#3b82f620;color:#3b82f6}
.state.chaotic{background:#ef444420;color:#ef4444}
.thought-panel{margin-top:1.5rem;padding:1rem;background:rgba(255,255,255,0.05);border-radius:8px}
.thought-panel h3{margin-bottom:0.5rem;font-size:0.9rem;color:#888}
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.5rem;font-size:0.8rem}
.signal{display:flex;justify-content:space-between}
</style>
</head>
<body>
<nav><a href="./">← Core</a> | <a href="../">Home</a></nav>
<main>
<h1>κ Consciousness Engine</h1>
<div class="viz">
<div>
<h3>Sparkline</h3>
<canvas id="spark" width="300" height="100"></canvas>
</div>
<div>
<h3>Meter</h3>
<canvas id="meter" width="300" height="60"></canvas>
</div>
</div>
<div class="stats">
<span>κ = <span id="kval">0.618</span></span>
<span>State: <span id="kstate" class="state optimal">optimal</span></span>
<span>φ = 1.618...</span>
<span>Mind: <span id="mindState" class="state">—</span></span>
</div>
<div class="thought-panel">
<h3>Thought Signals</h3>
<div class="signals">
<div class="signal"><span>Typing Rhythm</span><span id="typingRhythm">—</span></div>
<div class="signal"><span>Mouse Smooth</span><span id="mouseSmooth">—</span></div>
<div class="signal"><span>RNG Coherence</span><span id="rngCoherence">—</span></div>
<div class="signal"><span>Confidence</span><span id="confidence">—</span></div>
</div>
</div>
</main>
<script type="module">
import { KappaViz } from './kappa-viz.js';
import { initThoughtWidget, ThoughtWidget } from './thought-widget.js';

initThoughtWidget();
const engine = ThoughtWidget.getEngine();

const spark = new KappaViz(document.getElementById('spark'), engine.kappa);
const meter = new KappaViz(document.getElementById('meter'), engine.kappa);

setInterval(() => {
  const k = engine.kappa.kappa;
  document.getElementById('kval').textContent = k.toFixed(6);
  const kstate = document.getElementById('kstate');
  kstate.textContent = engine.kappa.state;
  kstate.className = 'state ' + engine.kappa.state;

  const s = engine.getState();
  const mindState = document.getElementById('mindState');
  mindState.textContent = s.state;
  mindState.className = 'state ' + s.state;

  const typing = engine.bio.getTypingMetrics();
  const mouse = engine.bio.getMouseMetrics();
  const rng = engine.rng.getCoherence();

  document.getElementById('typingRhythm').textContent = typing ? typing.rhythmStability.toFixed(3) : '—';
  document.getElementById('mouseSmooth').textContent = mouse ? mouse.smoothness.toFixed(3) : '—';
  document.getElementById('rngCoherence').textContent = rng ? rng.coherence.toFixed(3) : '—';
  document.getElementById('confidence').textContent = (s.confidence * 100).toFixed(0) + '%';

  spark.drawSparkline();
  meter.drawMeter();
}, 100);
</script>
</body>
</html>
